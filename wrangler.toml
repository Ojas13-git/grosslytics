name = "grosslytics-edge-api"
main = "apps/edge-api/src/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public", "web_socket_auto_reply_to_close"]

# Smart Placement for optimal latency
[placement]
mode = "smart"

# D1 SQLite Database
[[d1_databases]]
binding = "DB"
database_name = "grosslytics-db"
database_id = "" # Local dev only. `bun run setup` creates the real database and writes its own config

# Cloudflare Queues - Ingestion Pipeline
[[queues.producers]]
queue = "grosslytics-ingest"
binding = "INGEST_QUEUE"

[[queues.consumers]]
queue = "grosslytics-ingest"
max_batch_size = 100
max_batch_timeout = 1
max_retries = 3
dead_letter_queue = "grosslytics-ingest-dlq"

# Durable Objects - Real-Time Presence
[durable_objects]
bindings = [
  { name = "SITE_LIVE_HUB", class_name = "SiteLiveHub" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SiteLiveHub"] # SQLite-backed: required on the Workers Free plan

# Rate limit for the public waitlist form (5 per minute per IP)
[[ratelimits]]
name = "WAITLIST_LIMITER"
namespace_id = "1001"
simple = { limit = 5, period = 60 }

# Hosted Cloud sign-ups (5 per minute per IP), so trials can't be minted in bulk
[[ratelimits]]
name = "SIGNUP_LIMITER"
namespace_id = "1002"
simple = { limit = 5, period = 60 }

[[ratelimits]]
name = "LOGIN_LIMITER"
namespace_id = "1003"
simple = { limit = 10, period = 60 }

[[ratelimits]]
name = "INGEST_SOURCE_LIMITER"
namespace_id = "1004"
simple = { limit = 300, period = 60 }

[[ratelimits]]
name = "INGEST_SITE_LIMITER"
namespace_id = "1005"
simple = { limit = 6000, period = 60 }

[[ratelimits]]
name = "LICENSE_LIMITER"
namespace_id = "1006"
simple = { limit = 15, period = 60 }

# Daily cleanup of delivery receipts and expired sessions
[triggers]
crons = ["17 3 * * *"]

# Environment variables
[vars]
ENVIRONMENT = "production"
TRACKER_ORIGIN = "https://grosslytics.com"
PLUNK_FROM_EMAIL = "support@grosslytics.com"

# Dev overrides
[env.dev]
name = "grosslytics-edge-api-dev"
[env.dev.vars]
ENVIRONMENT = "development"
TRACKER_ORIGIN = "http://localhost:4321"
